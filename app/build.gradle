plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 覆盖安装原 app 的前提：必须用原版调试证书签名。
// 证书位置由 local.properties 的 QUICKDOT_KEYSTORE 覆盖，缺省指向项目根的 debug.keystore。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    // Properties.load(InputStream) 按 ISO-8859-1 解码，中文路径会变乱码，故显式用 UTF-8
    localPropsFile.withInputStream { localProps.load(new InputStreamReader(it, 'UTF-8')) }
}
def keystoreFile = rootProject.file(
        localProps.getProperty('QUICKDOT_KEYSTORE') ?: '../../debug.keystore')

android {
    namespace 'com.study.quickdot'
    compileSdk 35

    defaultConfig {
        applicationId "com.study.quickdot"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.0"
    }

    signingConfigs {
        original {
            storeFile keystoreFile
            storePassword localProps.getProperty('QUICKDOT_STORE_PASSWORD') ?: 'android'
            keyAlias localProps.getProperty('QUICKDOT_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword localProps.getProperty('QUICKDOT_KEY_PASSWORD') ?: 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.original
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.original
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
